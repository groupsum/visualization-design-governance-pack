  "summary": "Before testing, record the audience, task, datasets, baseline, primary outcome, acceptance margin, sample plan, exclusion criteria and analysis plan.",
  "body": "- Before testing, record the audience, task, datasets, baseline, primary outcome, acceptance margin, sample plan, exclusion criteria and analysis plan.\n- Hold data and task constant; randomize assignment or counterbalance order, record device and familiarity, and prevent practice effects or unequal access to exact labels.\n- Measure accuracy or error, completion time and failures; measure comprehension or recall separately when claimed. Report effect sizes with uncertainty, sample sizes, exclusions and missing outcomes.\n- Test domain usefulness with intended users, and separate accessibility and performance gates from experiment outcomes. Do not generalize beyond the tested population, tasks, stimuli and conditions.\n\nVerification evidence:\n- Versioned protocol and stimuli, anonymized task records, reproducible analysis, and a decision with limitations.\n- A baseline comparison and an explicit inconclusive outcome when uncertainty crosses the decision margin.",
