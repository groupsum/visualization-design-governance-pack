  "summary": "Declare row/column identities and ordering, bucket boundaries, metric and scale. Share fixed legend thresholds across comparable views.",
  "body": "- Declare row/column identities and ordering, bucket boundaries, metric and scale. Share fixed legend thresholds across comparable views.\n- Use ordered luminance for increasing amounts, a diverging scale only for a meaningful reference, and qualitative color for nominal identity.\n- Use a distinguishable outline, pattern or explicit label for unavailable coverage; keep true zero as a quantitative state. Do not silently collapse partial coverage into zero.\n- Keep exact cell values and dates available in a list or table and make selected cells filter the corresponding evidence.\n\nVerification evidence:\n- Fixtures across intensity boundaries, zero versus unavailable, partial intervals and extreme values.\n- Rendered checks in supported themes and grayscale plus keyboard, touch and text-alternative inspection.",
