  "decision": [
    "Separate literature evidence from downstream product evidence.",
    "Compare with a credible baseline using predeclared task outcomes and acceptance margins.",
    "Report uncertainty, exclusions, failures and limitations. An inconclusive result does not certify superiority."
  ],
  "consequences": [
    "Downstream teams must retain a reviewable evidence trail and document exceptions."
  ]
}
